# Root config so `ruff check .` covers scripts/ as well as backend/.
# All settings live in backend/pyproject.toml; this file only extends them.
extend = "backend/pyproject.toml"
extend-exclude = ["*.ipynb"]

[lint.per-file-ignores]
# Scripts insert backend/ on sys.path before importing app modules.
"scripts/*" = ["E402"]
# Notebook builders embed whole notebook cells as strings: line length and typography are the cells'.
"notebooks/src/build_*.py" = ["E501", "RUF001"]
