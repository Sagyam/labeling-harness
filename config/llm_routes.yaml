# Inference routing. Every provider here is prepaid: a runaway job can exhaust a balance the
# owner topped up, but cannot produce an invoice. That, not the vendor, is the rule (D10, D21).
#
# A route named `asr*` becomes one ASR system during ingestion, in the order written below. The
# first route is the primary hypothesis: it supplies the text that analysis, CMI and the rule
# flags are computed from, so keep the most accurate model at the top.
enabled: true
base_url: https://openrouter.ai/api/v1
elevenlabs_base_url: https://api.elevenlabs.io/v1
google_base_url: https://generativelanguage.googleapis.com/v1beta
default_timeout_seconds: 60
default_max_tokens: 1024
max_retries: 4
retry_backoff_seconds: 2.0
dry_run: false
routes:
  # ElevenLabs Scribe v2, called directly (ELEVEN_LABS_API_KEY). The only transcriber configured
  # here that returns word spans and per-word log probabilities, which is why it is primary: the
  # `low_confidence` term of the priority score has no other source.
  #
  # Scribe takes no free-text prompt, so the transcript policy cannot be stated to it in prose.
  # `language: ne` and the key terms in app/llm/transcription.py are the whole of its steering.
  asr_scribe_v2:
    provider: elevenlabs
    api: transcription
    system_id: elevenlabs-scribe-v2
    model: scribe_v2
    language: ne

  # Microsoft MAI-Transcribe 2 via OpenRouter's /audio/transcriptions endpoint. A dedicated
  # speech recogniser with native support for multilingual code-switching. Replaces Gemini Flash
  # as the secondary disagreement signal (decision D28).
  asr_mai_transcribe_2:
    provider: openrouter
    api: transcription
    system_id: mai-transcribe-2
    model: microsoft/mai-transcribe-2
    language: ne

  # Gemini 3.5 Transcribe via Google AI Studio (GOOGLE_API_KEY). Dedicated speech recogniser
  # operating in verbatim mode with word-level timestamps (decision D29).
  asr_gemini_transcribe:
    provider: google
    api: transcription
    system_id: gemini-3.5-transcribe
    model: gemini-3.5-transcribe
    language: ne


