# All LLM inference from this codebase goes through OpenRouter. No direct provider calls.
# At MVP no route is wired to any pipeline stage: routes is intentionally empty.
enabled: false
base_url: https://openrouter.ai/api/v1
default_timeout_seconds: 30
default_max_tokens: 1024
max_retries: 3
retry_backoff_seconds: 0.5
dry_run: true
routes: {}
