# All LLM inference from this codebase goes through OpenRouter. No direct provider calls.
enabled: true
base_url: https://openrouter.ai/api/v1
default_timeout_seconds: 60
default_max_tokens: 1024
max_retries: 3
retry_backoff_seconds: 0.5
dry_run: false
routes:
  asr_chirp:
    model: google/chirp-3
