# Non-secret configuration for the annotation harness.
# Secrets (passwords, API keys, bearer tokens) come from environment variables only.
# Every value here can be overridden by an env var: HARNESS_<SECTION>__<KEY> (double underscore
# separates nesting levels), e.g. HARNESS_DATABASE__PORT=5433.

app:
  name: labeling-harness
  environment: local
  log_level: INFO

database:
  host: localhost
  port: 5432
  name: harness
  user: harness
  password: ""          # HARNESS_DATABASE__PASSWORD
  pool_size: 5

storage:
  backend: local        # 'local' | 'minio' -- the harness must be usable without MinIO running
  local_root: ./data/objects
  minio:
    endpoint: localhost:9000
    bucket: harness
    secure: false
    access_key: ""      # HARNESS_STORAGE__MINIO__ACCESS_KEY
    secret_key: ""      # HARNESS_STORAGE__MINIO__SECRET_KEY

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
  auth_token: ""        # HARNESS_API__AUTH_TOKEN -- when empty, no authentication (local dev)

importer:
  peaks_buckets: 1000
  expected_sample_rate: 16000
  expected_channels: 1
  expected_format: FLAC

# Pot targets (D71). Gold is chosen per clip, by hand -- these are progress bars for the
# dashboard, not rules. Durations, not ratios.
dataset:
  gold_hours_target: 3.0         # ~3 h is ~27k reference words, which holds the standard error
                                 # on WER under a point -- ample to rank three systems. What
                                 # limits this benchmark is speakers, not hours (D69).
  train_hours_target: 20.0       # informational. Down from 50 h: the from-scratch scaling curve
                                 # behind that figure does not apply to domain adaptation on a
                                 # pretrained model, and the corpus is limited by speakers.
  val_fraction: 0.1              # share of episodes whose non-gold clips are val; redrawable
  pot_seed: 20260101             # seed for that draw
  coverage_keys:                 # what the dashboard checks gold against
    - show_id
    - gender
    - age_bracket
    - topic
  min_stratum_hours: 1.0         # under this, the analytics page calls a stratum thin (D69)

queue:
  weights:                       # must sum to 1.0; validated at load
    seed_outvoted: 0.30          # speech-time share where every other system contradicts the seed
    seed_orphan_rate: 0.30       # share of seed tokens no other system has, at any time (D67)
    roman_gap: 0.20              # Latin tokens the others agree on and the seed lacks (D67)
    low_confidence: 0.125
    rule_flag_score: 0.075
  legacy_weights:                # recorded beside the live score for comparison only (D54)
    word_disagreement_rate: 0.40
    code_switch_density: 0.20
  audit_sample_rate: 0.05
  audit_seed: 1234
  min_duration_seconds: 1.0
  max_duration_seconds: 30.0
  logprob_floor: -0.5            # avg_logprob <= floor normalizes to low_confidence = 1.0
  no_speech_prob_threshold: 0.6
  max_speaking_rate_wps: 6.0     # words per second above this is implausible
  min_speaking_rate_wps: 0.3
  repeated_ngram_size: 4
  repeated_ngram_threshold: 3

translit:
  provider_order:
    - remote
    - offline
  remote_endpoint: https://inputtools.google.com/request
  remote_timeout_seconds: 1.5
  max_candidates: 5

labels:
  policy_version: policy_v1
  default_label_version: v1
  default_annotator: owner

export:
  output_root: ./exports

ingest:
  work_root: ./data/ingest_work   # scratch space for web uploads; removed when a job finishes
  max_segment_concurrency: 4     # number of segments transcribed concurrently
  # Text route that labels an episode's topic from its own transcript, once per episode, only
  # when the form left the topic blank (D57). Empty disables it.
  topic_route: classify_topic
  youtube:
    format: bestaudio/best        # yt-dlp selector; stage 1 re-encodes, so audio-only is enough
    max_duration_seconds: 14400   # 4 h; a longer video is refused before anything is downloaded
    probe_timeout_seconds: 30
    download_timeout_seconds: 1800
    cookies_file: ""              # Netscape cookie jar, for videos YouTube will not serve anonymously
