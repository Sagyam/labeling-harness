# Orthographic normalization applied to label text at export (D64).
#
# The database keeps exactly what the annotator typed. This table is applied on the way out, so
# it is re-runnable over the whole corpus, revisable without a migration, and never silently
# rewrites history. `version` is stamped into every export manifest: a consumer that wants to
# evaluate against this corpus must apply the same table to its own references, or spelling
# disagreement will show up as word error.
#
# Rules are whole-token substitutions. A source must be one token -- no spaces, no danda -- and
# no rule's target may be another rule's source, both of which are enforced at load.
#
# EVERY RULE HERE IS HUMAN-APPROVED. Rules mined automatically out of the edit history are
# candidates only: that process proposed `जे -> day` from a single mishearing correction, and
# जे is a common Nepali word. Nothing goes in this file because a script suggested it.

version: norm-v3

tokens:
  # ---------------------------------------------------------------------------------------
  # The word the corpus was split on: चैँ 115 vs चाहिँ 127 across 340 labels. Not a
  # transcription error -- चैँ is a legitimate colloquial spelling -- but the corpus has to
  # pick one, and a coin flip in the training data teaches a model that both are right in
  # identical contexts.
  # ---------------------------------------------------------------------------------------
  चैँ: चाहिँ
  चैं: चाहिँ
  चाहीँ: चाहिँ
  चाहिं: चाहिँ

  # ---------------------------------------------------------------------------------------
  # ू / ु on the plural suffix हरू. The long form wins everywhere it is contested:
  # हरू 30 vs हरु 1, उनीहरूको 7 vs उनीहरुको 1, हरूको 5 vs हरुको 1, हरूमा 2 vs हरुमा 1.
  # हामीहरूको was an exact 5-5 tie and was broken by the owner in favour of the long form,
  # to agree with the rest of the corpus.
  # ---------------------------------------------------------------------------------------
  हरु: हरू
  हरुको: हरूको
  हरुमा: हरूमा
  हरुले: हरूले
  उनीहरुको: उनीहरूको
  हामीहरुको: हामीहरूको
  हामिहरुले: हामीहरूले
  यिनीहरुले: यिनीहरूले

  # ---------------------------------------------------------------------------------------
  # ी / ि where the short form holds the majority.
  # ---------------------------------------------------------------------------------------
  चीज: चिज
  चीजहरू: चिजहरू
  गरीरहेको: गरिरहेको
  गरीब: गरिब

  # ---------------------------------------------------------------------------------------
  # ं / ँ on first-person-plural and hortative endings. The chandrabindu form is the majority
  # in every contested pair: भनौँ 12 vs भनौं 4, हेरौँ 6 vs हेरौं 4.
  # ---------------------------------------------------------------------------------------
  भनौं: भनौँ
  हेरौं: हेरौँ
  गर्यौं: गर्यौँ

  # ---------------------------------------------------------------------------------------
  # English loanwords spelled phonetically in Devanagari. The corpus policy is English in
  # Latin, Nepali in Devanagari, and these were left in Devanagari inconsistently rather
  # than deliberately: कफी kept 18 / converted 11, ट्राफिक 5 / 6, ड्राइभर 9 / 3, रोड 15 / 2.
  # हेल्मेट (0/9) and फोन (35/0) show the two ends of the same split. The owner's ruling is
  # that the kept forms were sloppiness, so the Latin form wins everywhere.
  #
  # Every inflected form attested in the corpus needs its own rule -- substitution is
  # whole-token -- and the Devanagari suffix stays attached to the Latin stem, matching the
  # joined convention the labels already use (governmentकै, vehicleहरू).
  # ---------------------------------------------------------------------------------------
  कफी: coffee
  कफीको: coffeeको
  कफीमा: coffeeमा
  फोन: phone
  फोनमा: phoneमा
  फोनको: phoneको
  फोनहरूमा: phoneहरूमा
  फोनले: phoneले
  फोनहरूलाई: phoneहरूलाई
  फोनसँग: phoneसँग
  फोनहरू: phoneहरू
  फोनबाट: phoneबाट
  फोनलाई: phoneलाई
  रोड: road
  रोडको: roadको
  रोडमा: roadमा
  कम्पनी: company
  कम्पनीले: companyले
  कम्पनीको: companyको
  कम्पनीमा: companyमा
  कार: car
  कारको: carको
  कारहरूको: carहरूको
  कारमा: carमा
  फोटो: photo
  ड्राइभर: driver
  ड्राइभरले: driverले
  ड्राइभरलाई: driverलाई
  सेयर: share
  ट्राफिक: traffic
