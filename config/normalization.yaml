# Variants observed in the corpus that are deliberately NOT normalized. Each needs a decision
# from someone who speaks the language, and a wrong rule here is unrecoverable once a consumer
# has the export. Moving one up into `tokens` is a one-line change.
#
#   ऊ (15)  vs  उ (4)        -- separate letters, and both are attested pronouns
#   ऊले (1) vs  उले (1)      -- same question, no majority to appeal to
#   ई (2)   vs  इ (1)        -- separate letters
#   बिचमा (1) vs बीचमा (1)   -- both standard, no majority
#   बिचको (1) vs बीचको (1)   -- same
#   गर्या (5) vs गऱ्या (2)    -- ऱ (U+0931) is a distinct character, not a diacritic variant
#   पर्यो। (1) vs पऱ्यो। (3)  -- same
#   हेर्यौं (1) vs हेऱ्यौँ (1) -- same
#   लुडो (1) vs लूडो (1)      -- proper noun (the game), no house style established
#   नेपाल (46) vs nepal (10)   -- ruled: Nepal stays Devanagari, it is not a foreign name
#   नेपाली (68) vs nepali (4)  -- same ruling
