  मोटरसाइकल: motorcycle
  मोटरसाइकलको: motorcycleको
  मोटरसाइकलमा: motorcycleमा
  बाइक: bike
  हेल्मेट: helmet
  इम्पोर्ट: import
  कलेजमा: collegeमा
  ड्युटी: duty
  कारहरू: carहरू
  डमीहरूमा: dummyहरूमा
