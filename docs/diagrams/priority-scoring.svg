<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="priority-scoring-title priority-scoring-desc">
      <title id="priority-scoring-title">Priority score composition</title>
      <desc id="priority-scoring-desc">Three normalized signals combine into a segment's queue priority, with band width proportional to each weight. Seed outvoted contributes 0.60 and rule flags 0.15; both read every ASR hypothesis of the segment. Low confidence contributes 0.25 and reads the seed hypothesis alone. The three weights sum to 1.0, so the score is itself in the zero-to-one range.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606e"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#146b6b"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606e"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ============ COLUMN HEADERS ============ -->
      <text x="97" y="56" fill="#7d8794" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.14em">READS</text>
      <text x="266" y="56" fill="#7d8794" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.14em">COMPONENT · WEIGHT</text>
      <text x="447" y="56" fill="#7d8794" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.14em">QUEUE SCORE</text>

      <!-- ============ ORDINARY RIBBONS ============ -->
      <!-- all systems -> rule_flag_score -->
      <path d="M 152,332 C 206,332 206,348 260,348 L 260,396 C 206,396 206,380 152,380 Z" fill="rgba(85,96,110,0.18)"/>
      <!-- the seed -> low_confidence -->
      <path d="M 152,420 C 206,420 206,436 260,436 L 260,516 C 206,516 206,500 152,500 Z" fill="rgba(85,96,110,0.18)"/>
      <!-- rule_flag_score -> priority_score -->
      <path d="M 272,348 C 328,348 328,368 384,368 L 384,416 C 328,416 328,396 272,396 Z" fill="rgba(85,96,110,0.18)"/>
      <!-- low_confidence -> priority_score -->
      <path d="M 272,436 C 328,436 328,416 384,416 L 384,496 C 328,496 328,516 272,516 Z" fill="rgba(85,96,110,0.18)"/>

      <!-- ============ FOCAL PATH (painted last among ribbons) ============ -->
      <path d="M 152,140 C 206,140 206,116 260,116 L 260,308 C 206,308 206,332 152,332 Z" fill="rgba(20,107,107,0.28)"/>
      <path d="M 272,116 C 328,116 328,176 384,176 L 384,368 C 328,368 328,308 272,308 Z" fill="rgba(20,107,107,0.28)"/>

      <!-- ============ NODE BARS ============ -->
      <rect x="140" y="140" width="12" height="240" fill="#1b2430"/>
      <rect x="140" y="420" width="12" height="80" fill="#1b2430"/>
      <rect x="260" y="116" width="12" height="192" fill="#1b2430"/>
      <rect x="260" y="348" width="12" height="48" fill="#1b2430"/>
      <rect x="260" y="436" width="12" height="80" fill="#1b2430"/>
      <rect x="384" y="176" width="12" height="320" fill="#1b2430"/>

      <!-- ============ COLUMN 1 LABELS (outside, anchor end) ============ -->
      <text x="132" y="254" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">all systems</text>
      <text x="132" y="274" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="end">0.75</text>

      <text x="132" y="454" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">the seed</text>
      <text x="132" y="474" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="end">0.25</text>

      <!-- ============ COLUMN 2 LABELS (gutter, anchor middle) ============ -->
      <text x="266" y="88" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">0.60</text>
      <text x="266" y="104" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">seed_outvoted</text>

      <text x="266" y="320" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">0.15</text>
      <text x="266" y="336" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">rule_flag_score</text>

      <text x="266" y="408" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">0.25</text>
      <text x="266" y="424" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">low_confidence</text>

      <!-- ============ COLUMN 3 LABELS (outside, anchor start) ============ -->
      <text x="404" y="332" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif">priority_score</text>
      <text x="404" y="352" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace">1.00</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="596" x2="520" y2="596" stroke="rgba(27,36,48,0.14)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="608" width="16" height="8" fill="rgba(85,96,110,0.18)"/>
      <text x="136" y="616" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">FLOW</text>

      <rect x="200" y="608" width="16" height="8" fill="rgba(20,107,107,0.28)"/>
      <text x="224" y="616" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">FOCAL</text>

      <text x="520" y="616" fill="#1b2430" font-size="16" font-style="italic" font-family="'Source Serif 4', serif" text-anchor="end">weights sum to 1.0</text>
    </svg>
