<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="priority-scoring-title priority-scoring-desc">
      <title id="priority-scoring-title">Priority score composition</title>
      <desc id="priority-scoring-desc">Four normalized signals combine into a segment's queue priority, with band width proportional to each weight. Cross-system word disagreement contributes 0.40 and rule flags 0.15; both are computed over every ASR hypothesis of the segment. Low confidence contributes 0.25 and code-switch density 0.20; each reads a single chosen hypothesis. The four weights sum to 1.0, so the score is itself in the zero-to-one range.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606e"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#146b6b"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606e"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ============ COLUMN HEADERS ============ -->
      <text x="97" y="56" fill="#7d8794" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.14em">READS</text>
      <text x="266" y="56" fill="#7d8794" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.14em">COMPONENT · WEIGHT</text>
      <text x="447" y="56" fill="#7d8794" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.14em">QUEUE SCORE</text>

      <!-- ============ ORDINARY RIBBONS ============ -->
      <!-- all systems -> rule_flag_score -->
      <path d="M 152,292 C 206,292 206,284 260,284 L 260,332 C 206,332 206,340 152,340 Z" fill="rgba(85,96,110,0.18)"/>
      <!-- one system -> low_confidence -->
      <path d="M 152,364 C 206,364 206,372 260,372 L 260,452 C 206,452 206,444 152,444 Z" fill="rgba(85,96,110,0.18)"/>
      <!-- one system -> code_switch_density -->
      <path d="M 152,444 C 206,444 206,492 260,492 L 260,556 C 206,556 206,508 152,508 Z" fill="rgba(85,96,110,0.18)"/>
      <!-- rule_flag_score -> priority_score -->
      <path d="M 272,284 C 328,284 328,304 384,304 L 384,352 C 328,352 328,332 272,332 Z" fill="rgba(85,96,110,0.18)"/>
      <!-- low_confidence -> priority_score -->
      <path d="M 272,372 C 328,372 328,352 384,352 L 384,432 C 328,432 328,452 272,452 Z" fill="rgba(85,96,110,0.18)"/>
      <!-- code_switch_density -> priority_score -->
      <path d="M 272,492 C 328,492 328,432 384,432 L 384,496 C 328,496 328,556 272,556 Z" fill="rgba(85,96,110,0.18)"/>

      <!-- ============ FOCAL PATH (painted last among ribbons) ============ -->
      <path d="M 152,164 C 206,164 206,116 260,116 L 260,244 C 206,244 206,292 152,292 Z" fill="rgba(20,107,107,0.28)"/>
      <path d="M 272,116 C 328,116 328,176 384,176 L 384,304 C 328,304 328,244 272,244 Z" fill="rgba(20,107,107,0.28)"/>

      <!-- ============ NODE BARS ============ -->
      <rect x="140" y="164" width="12" height="176" fill="#1b2430"/>
      <rect x="140" y="364" width="12" height="144" fill="#1b2430"/>
      <rect x="260" y="116" width="12" height="128" fill="#1b2430"/>
      <rect x="260" y="284" width="12" height="48" fill="#1b2430"/>
      <rect x="260" y="372" width="12" height="80" fill="#1b2430"/>
      <rect x="260" y="492" width="12" height="64" fill="#1b2430"/>
      <rect x="384" y="176" width="12" height="320" fill="#1b2430"/>

      <!-- ============ COLUMN 1 LABELS (outside, anchor end) ============ -->
      <text x="132" y="248" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">all systems</text>
      <text x="132" y="268" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="end">0.55</text>

      <text x="132" y="432" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">one system</text>
      <text x="132" y="452" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="end">0.45</text>

      <!-- ============ COLUMN 2 LABELS (gutter, anchor middle) ============ -->
      <text x="266" y="88" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">0.40</text>
      <text x="266" y="104" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">word_disagreement_rate</text>

      <text x="266" y="260" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">0.15</text>
      <text x="266" y="276" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">rule_flag_score</text>

      <text x="266" y="348" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">0.25</text>
      <text x="266" y="364" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">low_confidence</text>

      <text x="266" y="468" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">0.20</text>
      <text x="266" y="484" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">code_switch_density</text>

      <!-- ============ COLUMN 3 LABELS (outside, anchor start) ============ -->
      <text x="404" y="332" fill="#1b2430" font-size="16" font-weight="600" font-family="'Inter', sans-serif">priority_score</text>
      <text x="404" y="352" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace">1.00</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="596" x2="520" y2="596" stroke="rgba(27,36,48,0.14)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="608" width="16" height="8" fill="rgba(85,96,110,0.18)"/>
      <text x="136" y="616" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">FLOW</text>

      <rect x="200" y="608" width="16" height="8" fill="rgba(20,107,107,0.28)"/>
      <text x="224" y="616" fill="#55606e" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">FOCAL</text>

      <text x="520" y="616" fill="#1b2430" font-size="16" font-style="italic" font-family="'Source Serif 4', serif" text-anchor="end">weights sum to 1.0</text>
    </svg>
