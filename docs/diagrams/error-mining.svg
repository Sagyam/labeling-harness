<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="errors-title errors-desc">
  <title id="errors-title">Error mining</title>
  <desc id="errors-desc">Every word pair of an evaluation becomes a row. The reference, the label as it was when scored, and the model's text, from evalkit or an imported run, are compared through the folding rulebook in fold.py. Tier 1, orthography, tier 2, across scripts by sound, and tier 3, colloquial Nepali forms, forgive a pair; tier 4 variants, which might be two different words, stay charged and are tagged. A rule enters tiers 1 to 3 only if it joins no two different words. The texts are aligned and each pair is classified as match, fold, merge, substitution, deletion or insertion, with the rule that forgave it, the error's tag, each side's script, whether a number is involved, similarity, and the clip's crosstalk and SNR. The rows are written to errors/set.parquet beside the model: derived from the texts and never edited, stamped with fold and miner version, and refused under another miner version. DuckDB answers every breakdown from them: WER with substitutions, deletions and insertions, crosstalk buckets, numbers, the confusion table, the attribution card and word rarity, shown on the Models page, the Rulebook page and in 09 Report. A breakdown tags errors and never forgives one.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&amp;display=swap');
      text { font-family: 'Inter', sans-serif; }
      .n { font-size: 16px; font-weight: 600; fill: #1b2430; }
      .k { font-size: 12px; font-weight: 600; fill: #1b2430; }
      .s { font-size: 12px; fill: #55606e; }
      .m { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #55606e; }
      .mi { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #1b2430; }
      .e { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #7d8794; letter-spacing: 0.14em; }
      .ea { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #146b6b; letter-spacing: 0.14em; }
      .st { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; fill: #1b2430; }
      .c { font-family: 'Source Serif 4', serif; font-style: italic; font-size: 16px; fill: #1b2430; }
      .box { fill: #ffffff; stroke: #1b2430; stroke-width: 1; }
      .in { fill: rgba(85,96,110,0.10); stroke: #7d8794; stroke-width: 1; }
      .ext { fill: rgba(27,36,48,0.03); stroke: rgba(27,36,48,0.30); stroke-width: 1; }
      .store { fill: rgba(27,36,48,0.05); stroke: #55606e; stroke-width: 1; }
      .leaf { fill: #ffffff; stroke: #55606e; stroke-width: 0.8; }
      .focal { fill: rgba(20,107,107,0.09); stroke: #146b6b; stroke-width: 1.2; }
      .flow { stroke: #55606e; stroke-width: 1; fill: none; }
      .dash { stroke: #55606e; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text class="e" x="40" y="36">EVERY WORD PAIR OF AN EVALUATION</text>
  <rect class="in" x="40" y="48" width="232" height="56" rx="6"/>
  <text class="n" x="56" y="72">Reference</text>
  <text class="s" x="56" y="92">the label, as it was when scored</text>
  <rect class="in" x="288" y="48" width="232" height="56" rx="6"/>
  <text class="n" x="304" y="72">Model text</text>
  <text class="s" x="304" y="92">from evalkit, or an imported run</text>
  <line class="flow" x1="156" y1="104" x2="156" y2="128" marker-end="url(#ar)"/>
  <line class="flow" x1="404" y1="104" x2="404" y2="128" marker-end="url(#ar)"/>

  <rect class="focal" x="40" y="128" width="480" height="140" rx="6"/>
  <text class="n" x="56" y="152">Folding rulebook</text>
  <text class="mi" x="504" y="152" text-anchor="end">fold.py</text>
  <text class="mi" x="56" y="184">tier 1</text>
  <text class="s" x="120" y="184">orthography: one word, spelled another way</text>
  <text class="m" x="504" y="184" text-anchor="end">forgiven</text>
  <text class="mi" x="56" y="208">tier 2</text>
  <text class="s" x="120" y="208">across scripts, by sound</text>
  <text class="m" x="504" y="208" text-anchor="end">forgiven</text>
  <text class="mi" x="56" y="232">tier 3</text>
  <text class="s" x="120" y="232">colloquial Nepali forms</text>
  <text class="m" x="504" y="232" text-anchor="end">forgiven</text>
  <text class="mi" x="56" y="256">tier 4</text>
  <text class="s" x="120" y="256">variants that might be two different words</text>
  <text class="m" x="504" y="256" text-anchor="end">charged, tagged</text>
  <text class="s" x="40" y="292">A rule enters tiers 1–3 only if it joins no two different words.</text>

  <line class="flow" x1="280" y1="300" x2="280" y2="324" marker-end="url(#ar)"/>
  <rect class="box" x="40" y="324" width="480" height="96" rx="6"/>
  <text class="n" x="56" y="348">Align, then classify each pair</text>
  <text class="mi" x="56" y="372">match · fold · merge · sub · del · ins</text>
  <text class="s" x="56" y="392">with the rule that forgave it, the error's tag, each side's script,</text>
  <text class="s" x="56" y="408">number or not, similarity, and the clip's crosstalk and SNR</text>

  <line class="flow" x1="280" y1="420" x2="280" y2="444" marker-end="url(#ar)"/>
  <rect class="store" x="40" y="444" width="480" height="76" rx="6"/>
  <text class="mi" x="56" y="468">errors/&lt;set&gt;.parquet</text>
  <text class="m" x="504" y="468" text-anchor="end">beside the model</text>
  <text class="s" x="56" y="488">derived from the texts, never edited; stamped with fold and</text>
  <text class="s" x="56" y="504">miner version, and refused under another miner version</text>

  <line class="flow" x1="280" y1="520" x2="280" y2="544" marker-end="url(#ar)"/>
  <rect class="box" x="40" y="544" width="480" height="116" rx="6"/>
  <text class="n" x="56" y="568">Breakdowns, by DuckDB</text>
  <text class="mi" x="504" y="568" text-anchor="end">error_store</text>
  <rect class="leaf" x="56" y="588" width="144" height="24" rx="4"/>
  <text class="s" x="128" y="604" text-anchor="middle" fill="#1b2430" style="fill:#1b2430">WER with S/D/I</text>
  <rect class="leaf" x="208" y="588" width="144" height="24" rx="4"/>
  <text class="s" x="280" y="604" text-anchor="middle" fill="#1b2430" style="fill:#1b2430">crosstalk buckets</text>
  <rect class="leaf" x="360" y="588" width="144" height="24" rx="4"/>
  <text class="s" x="432" y="604" text-anchor="middle" fill="#1b2430" style="fill:#1b2430">numbers</text>
  <rect class="leaf" x="56" y="620" width="144" height="24" rx="4"/>
  <text class="s" x="128" y="636" text-anchor="middle" fill="#1b2430" style="fill:#1b2430">confusion table</text>
  <rect class="leaf" x="208" y="620" width="144" height="24" rx="4"/>
  <text class="s" x="280" y="636" text-anchor="middle" fill="#1b2430" style="fill:#1b2430">attribution card</text>
  <rect class="leaf" x="360" y="620" width="144" height="24" rx="4"/>
  <text class="s" x="432" y="636" text-anchor="middle" fill="#1b2430" style="fill:#1b2430">word rarity</text>

  <line class="flow" x1="280" y1="660" x2="280" y2="688" marker-end="url(#ar)"/>
  <rect class="in" x="40" y="688" width="152" height="40" rx="6"/>
  <text class="k" x="116" y="712" text-anchor="middle">Models page</text>
  <rect class="in" x="204" y="688" width="152" height="40" rx="6"/>
  <text class="k" x="280" y="712" text-anchor="middle">Rulebook page</text>
  <rect class="in" x="368" y="688" width="152" height="40" rx="6"/>
  <text class="k" x="444" y="712" text-anchor="middle">09 Report</text>

  <line x1="40" y1="752" x2="520" y2="752" stroke="rgba(27,36,48,0.14)" stroke-width="0.8"/>
  <text class="c" x="40" y="780">A breakdown tags errors; it never forgives one.</text>
</svg>
