<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="protocol-title protocol-desc">
  <title id="protocol-title">Training protocol</title>
  <desc id="protocol-desc">A model is trained and evaluated by running the notebooks in the order of their numbers, against one harness export on the hub pinned by date. 01 and 02 describe the corpus and train nothing. 03 fine-tunes Flex on the human labels in five steps, train, public sets, augment, blend and freeze, each chosen on val by a rule fixed before the result, and writes teacher.json, which names one frozen teacher. 04 PreDistill cuts unlabelled channels exactly like ingest and measures their crosstalk; 05 has the teacher pseudo-label them and drops crosstalk, loops, implausible rates and the least confident 15%. 06 ASR students and 07 speech-LLM students each run three stages: human, from pretrained weights on the human labels; distill, continued with the teacher's labels while half of each epoch's draws stay human; and distill-aug, the same with Flex's winning augmentation. evalkit scores every run the same way on gold, val and five public sets, folded and raw, with S/D/I and error rows. 08 measures how much a judge choosing among beam candidates could gain, and 09 reports every model in one table without a GPU. Only val chooses; gold and the public sets only report.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&amp;display=swap');
      text { font-family: 'Inter', sans-serif; }
      .n { font-size: 16px; font-weight: 600; fill: #1b2430; }
      .k { font-size: 12px; font-weight: 600; fill: #1b2430; }
      .s { font-size: 12px; fill: #55606e; }
      .m { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #55606e; }
      .mi { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #1b2430; }
      .e { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #7d8794; letter-spacing: 0.14em; }
      .ea { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #146b6b; letter-spacing: 0.14em; }
      .st { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; fill: #1b2430; }
      .c { font-family: 'Source Serif 4', serif; font-style: italic; font-size: 16px; fill: #1b2430; }
      .box { fill: #ffffff; stroke: #1b2430; stroke-width: 1; }
      .in { fill: rgba(85,96,110,0.10); stroke: #7d8794; stroke-width: 1; }
      .ext { fill: rgba(27,36,48,0.03); stroke: rgba(27,36,48,0.30); stroke-width: 1; }
      .store { fill: rgba(27,36,48,0.05); stroke: #55606e; stroke-width: 1; }
      .leaf { fill: #ffffff; stroke: #55606e; stroke-width: 0.8; }
      .focal { fill: rgba(20,107,107,0.09); stroke: #146b6b; stroke-width: 1.2; }
      .flow { stroke: #55606e; stroke-width: 1; fill: none; }
      .dash { stroke: #55606e; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text class="e" x="40" y="36">RUN IN THE ORDER OF THEIR NUMBERS</text>

  <rect class="in" x="40" y="48" width="480" height="56" rx="6"/>
  <text class="n" x="56" y="72">Harness export</text>
  <text class="mi" x="504" y="72" text-anchor="end">DATASET_EXPORT</text>
  <text class="s" x="56" y="92">the labels on the hub, pinned by date; another export is refused</text>
  <line class="flow" x1="280" y1="104" x2="280" y2="128" marker-end="url(#ar)"/>

  <rect class="box" x="40" y="128" width="480" height="40" rx="6"/>
  <text class="mi" x="56" y="153">01 · 02</text>
  <text class="s" x="120" y="153">describe the corpus and its speakers; train nothing</text>
  <line class="flow" x1="280" y1="168" x2="280" y2="192" marker-end="url(#ar)"/>

  <rect class="box" x="40" y="192" width="480" height="108" rx="6"/>
  <text class="n" x="56" y="216">03 · Fine-tune Flex</text>
  <text class="s" x="504" y="216" text-anchor="end">on the human labels</text>
  <rect class="leaf" x="52" y="228" width="84" height="48" rx="4"/>
  <text class="mi" x="94" y="248" text-anchor="middle">03a</text>
  <text class="s" x="94" y="266" text-anchor="middle">train</text>
  <rect class="leaf" x="144" y="228" width="84" height="48" rx="4"/>
  <text class="mi" x="186" y="248" text-anchor="middle">03b</text>
  <text class="s" x="186" y="266" text-anchor="middle">public sets</text>
  <rect class="leaf" x="236" y="228" width="84" height="48" rx="4"/>
  <text class="mi" x="278" y="248" text-anchor="middle">03c</text>
  <text class="s" x="278" y="266" text-anchor="middle">augment</text>
  <rect class="leaf" x="328" y="228" width="84" height="48" rx="4"/>
  <text class="mi" x="370" y="248" text-anchor="middle">03d</text>
  <text class="s" x="370" y="266" text-anchor="middle">blend</text>
  <rect class="leaf" x="420" y="228" width="84" height="48" rx="4"/>
  <text class="mi" x="462" y="248" text-anchor="middle">03e</text>
  <text class="s" x="462" y="266" text-anchor="middle">freeze</text>
  <text class="s" x="56" y="292">every choice made on val, by a rule fixed before the result</text>

  <line class="flow" x1="408" y1="300" x2="408" y2="324" marker-end="url(#ar)"/>
  <rect class="focal" x="296" y="324" width="224" height="44" rx="6"/>
  <text class="mi" x="312" y="344">teacher.json</text>
  <text class="s" x="312" y="360">names the one frozen teacher</text>
  <line class="flow" x1="408" y1="368" x2="408" y2="392" marker-end="url(#ar)"/>

  <rect class="box" x="40" y="392" width="224" height="88" rx="6"/>
  <text class="k" x="56" y="414">04 · PreDistill</text>
  <text class="s" x="56" y="434">unlabelled channels, cut</text>
  <text class="s" x="56" y="450">exactly like ingest;</text>
  <text class="s" x="56" y="466">crosstalk share measured</text>
  <line class="flow" x1="264" y1="436" x2="296" y2="436" marker-end="url(#ar)"/>
  <rect class="box" x="296" y="392" width="224" height="88" rx="6"/>
  <text class="k" x="312" y="414">05 · Teacher</text>
  <text class="s" x="312" y="434">pseudo-labels them, then drops</text>
  <text class="s" x="312" y="450">crosstalk, loops, odd rates and</text>
  <text class="s" x="312" y="466">the least confident 15%</text>
  <line class="flow" x1="408" y1="480" x2="408" y2="504" marker-end="url(#ar)"/>

  <rect class="box" x="40" y="504" width="480" height="112" rx="6"/>
  <text class="n" x="56" y="528">06 ASR students · 07 speech-LLM students</text>
  <rect class="leaf" x="52" y="544" width="136" height="60" rx="4"/>
  <text class="mi" x="64" y="564">human</text>
  <text class="s" x="64" y="580">from pretrained,</text>
  <text class="s" x="64" y="596">on the human labels</text>
  <line class="flow" x1="188" y1="574" x2="212" y2="574" marker-end="url(#ar)"/>
  <rect class="leaf" x="212" y="544" width="136" height="60" rx="4"/>
  <text class="mi" x="224" y="564">distill</text>
  <text class="s" x="224" y="580">+ teacher labels;</text>
  <text class="s" x="224" y="596">half of draws human</text>
  <line class="flow" x1="348" y1="574" x2="372" y2="574" marker-end="url(#ar)"/>
  <rect class="leaf" x="372" y="544" width="136" height="60" rx="4"/>
  <text class="mi" x="384" y="564">distill-aug</text>
  <text class="s" x="384" y="580">the same, with</text>
  <text class="s" x="384" y="596">Flex's augmentation</text>
  <line class="flow" x1="280" y1="616" x2="280" y2="640" marker-end="url(#ar)"/>

  <rect class="store" x="40" y="640" width="480" height="56" rx="6"/>
  <text class="mi" x="56" y="664">evalkit</text>
  <text class="s" x="120" y="664">scores every run of 03, 06 and 07 the same way</text>
  <text class="s" x="56" y="684">gold, val, five public sets; folded and raw, S/D/I, error rows</text>
  <line class="flow" x1="408" y1="696" x2="408" y2="720" marker-end="url(#ar)"/>

  <rect class="box" x="40" y="720" width="224" height="56" rx="6"/>
  <text class="k" x="56" y="744">08 · Judge headroom</text>
  <text class="s" x="56" y="764">could a judge pick a better beam?</text>
  <rect class="box" x="296" y="720" width="224" height="56" rx="6"/>
  <text class="k" x="312" y="744">09 · Report</text>
  <text class="s" x="312" y="764">every model in one table, no GPU</text>

  <line x1="40" y1="800" x2="520" y2="800" stroke="rgba(27,36,48,0.14)" stroke-width="0.8"/>
  <text class="c" x="40" y="828">Only val chooses; gold and the public sets only report.</text>
</svg>
