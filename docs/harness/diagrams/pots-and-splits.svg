<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pots-title pots-desc">
  <title id="pots-title">Pots and splits</title>
  <desc id="pots-desc">Every clip has a pot, chosen by hand one clip at a time, and every episode has a split, train or val, drawn by hash. A gold clip exports as test whatever its episode drew; gold holds verified labels only and reports results without choosing anything. A train-pot clip exports as its episode's split: train is what models learn from, and val is where every choice is made. Train-pot labels may be verified or screened. A clip enters gold when the owner picks it, with g in triage or from the editor; set_segment_pot is the only writer, every move writes an audit_logs row, and a clip carrying a screened label is refused with 409. Because clips of one episode can sit on both sides, every export row carries episode_spans_pots so gold can be reported with and without them. Splits may be redrawn; pots move only by hand, and no algorithm decides what is gold.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&amp;display=swap');
      text { font-family: 'Inter', sans-serif; }
      .n { font-size: 16px; font-weight: 600; fill: #1b2430; }
      .k { font-size: 12px; font-weight: 600; fill: #1b2430; }
      .s { font-size: 12px; fill: #55606e; }
      .m { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #55606e; }
      .mi { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #1b2430; }
      .e { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #7d8794; letter-spacing: 0.14em; }
      .ea { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #146b6b; letter-spacing: 0.14em; }
      .st { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; fill: #1b2430; }
      .c { font-family: 'Source Serif 4', serif; font-style: italic; font-size: 16px; fill: #1b2430; }
      .box { fill: #ffffff; stroke: #1b2430; stroke-width: 1; }
      .in { fill: rgba(85,96,110,0.10); stroke: #7d8794; stroke-width: 1; }
      .ext { fill: rgba(27,36,48,0.03); stroke: rgba(27,36,48,0.30); stroke-width: 1; }
      .store { fill: rgba(27,36,48,0.05); stroke: #55606e; stroke-width: 1; }
      .leaf { fill: #ffffff; stroke: #55606e; stroke-width: 0.8; }
      .focal { fill: rgba(20,107,107,0.09); stroke: #146b6b; stroke-width: 1.2; }
      .flow { stroke: #55606e; stroke-width: 1; fill: none; }
      .dash { stroke: #55606e; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- The matrix: pot by hand, split by hash -->
  <text class="e" x="200" y="36">EPISODE SPLIT, BY HASH</text>
  <text class="e" x="40" y="60">POT, BY HAND</text>
  <text class="st" x="276" y="60" text-anchor="middle">train</text>
  <text class="st" x="444" y="60" text-anchor="middle">val</text>

  <text class="st" x="40" y="104">gold</text>
  <text class="s" x="40" y="124">chosen clip by clip</text>
  <text class="s" x="40" y="140">verified labels only</text>
  <rect class="focal" x="200" y="72" width="320" height="84" rx="6"/>
  <text class="st" x="360" y="104" text-anchor="middle">test</text>
  <text class="s" x="360" y="124" text-anchor="middle">whatever its episode drew</text>
  <text class="s" x="360" y="140" text-anchor="middle">reports; never chooses anything</text>

  <text class="st" x="40" y="200">train</text>
  <text class="s" x="40" y="220">every clip starts here</text>
  <text class="s" x="40" y="236">verified or screened</text>
  <rect class="box" x="200" y="168" width="152" height="84" rx="6"/>
  <text class="st" x="276" y="200" text-anchor="middle">train</text>
  <text class="s" x="276" y="228" text-anchor="middle">what every model</text>
  <text class="s" x="276" y="244" text-anchor="middle">learns from</text>
  <rect class="box" x="368" y="168" width="152" height="84" rx="6"/>
  <text class="st" x="444" y="200" text-anchor="middle">val</text>
  <text class="s" x="444" y="228" text-anchor="middle">where every choice</text>
  <text class="s" x="444" y="244" text-anchor="middle">is made</text>

  <!-- Into gold -->
  <line x1="40" y1="284" x2="520" y2="284" stroke="rgba(27,36,48,0.14)" stroke-width="0.8"/>
  <text class="e" x="40" y="312">INTO GOLD, ONE CLIP AT A TIME</text>
  <rect class="in" x="40" y="328" width="144" height="56" rx="6"/>
  <text class="k" x="52" y="352">The owner picks it</text>
  <text class="s" x="52" y="370">g, or the editor</text>
  <line class="flow" x1="184" y1="356" x2="208" y2="356" marker-end="url(#ar)"/>
  <rect class="box" x="208" y="328" width="144" height="56" rx="6"/>
  <text class="mi" x="220" y="352">set_segment_pot</text>
  <text class="s" x="220" y="370">the only writer</text>
  <line class="flow" x1="352" y1="356" x2="376" y2="356" marker-end="url(#ar)"/>
  <rect class="store" x="376" y="328" width="144" height="56" rx="6"/>
  <text class="mi" x="388" y="352">audit_logs</text>
  <text class="s" x="388" y="370">a row for every move</text>
  <line class="dash" x1="280" y1="384" x2="280" y2="408" marker-end="url(#ar)"/>
  <text class="s" x="280" y="424" text-anchor="middle">409 if the clip carries a screened label</text>

  <!-- What every row carries -->
  <line x1="40" y1="452" x2="520" y2="452" stroke="rgba(27,36,48,0.14)" stroke-width="0.8"/>
  <text class="mi" x="40" y="480">episode_spans_pots</text>
  <text class="s" x="40" y="500">Clips of one episode can sit on both sides of the line, so every</text>
  <text class="s" x="40" y="516">export row says so, and gold is reported with and without them.</text>
  <text class="s" x="40" y="544">Splits are per episode and may be redrawn; pots move only by hand.</text>
  <text class="c" x="40" y="584">No algorithm decides what is gold.</text>
</svg>
