<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
  <title id="lifecycle-title">Decision path</title>
  <desc id="lifecycle-desc">A queue task starts pending. GET /tasks/next marks it in_progress, which is what lets reopening the app resume it, and a decision marks it done; triage can decide a pending task with one keystroke without opening the editor. Skipping makes a task skipped, and the clip returns as a new task at the next queue build. A done clip can be reopened (D114) as a new review task carrying the relabel hazard. Every decision is accept, edit or flag, and says whether the clip was verified, played and read, or screened, accepted without listening. Three cases are refused with 409: a screened decision on a gold clip, a screened decision on a clip a hazard gate fired on, and accepting the seed when the current label is an edit. Otherwise one transaction writes three rows: an appended segment_labels row with the disposition and tier, an annotation_events row with the client-reported duration, and an audit_logs row with old and new values. The four dispositions are accepted_unchanged, edited, unusable_audio and uncertain. A skip writes the event and the audit row but never a label.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&amp;display=swap');
      text { font-family: 'Inter', sans-serif; }
      .n { font-size: 16px; font-weight: 600; fill: #1b2430; }
      .k { font-size: 12px; font-weight: 600; fill: #1b2430; }
      .s { font-size: 12px; fill: #55606e; }
      .m { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #55606e; }
      .mi { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #1b2430; }
      .e { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #7d8794; letter-spacing: 0.14em; }
      .ea { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #146b6b; letter-spacing: 0.14em; }
      .st { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; fill: #1b2430; }
      .c { font-family: 'Source Serif 4', serif; font-style: italic; font-size: 16px; fill: #1b2430; }
      .box { fill: #ffffff; stroke: #1b2430; stroke-width: 1; }
      .in { fill: rgba(85,96,110,0.10); stroke: #7d8794; stroke-width: 1; }
      .ext { fill: rgba(27,36,48,0.03); stroke: rgba(27,36,48,0.30); stroke-width: 1; }
      .store { fill: rgba(27,36,48,0.05); stroke: #55606e; stroke-width: 1; }
      .leaf { fill: #ffffff; stroke: #55606e; stroke-width: 0.8; }
      .focal { fill: rgba(20,107,107,0.09); stroke: #146b6b; stroke-width: 1.2; }
      .flow { stroke: #55606e; stroke-width: 1; fill: none; }
      .dash { stroke: #55606e; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- A task's status -->
  <text class="e" x="40" y="36">A TASK</text>
  <path class="flow" d="M 84,72 L 84,56 L 484,56 L 484,72" marker-end="url(#ar)"/>
  <text class="s" x="284" y="50" text-anchor="middle">triage: one keystroke, no editor</text>

  <rect class="box" x="40" y="72" width="88" height="40" rx="6"/>
  <text class="st" x="84" y="97" text-anchor="middle">pending</text>
  <line class="flow" x1="128" y1="92" x2="232" y2="92" marker-end="url(#ar)"/>
  <text class="m" x="180" y="84" text-anchor="middle">/tasks/next</text>

  <rect class="box" x="232" y="72" width="120" height="40" rx="6"/>
  <text class="st" x="292" y="97" text-anchor="middle">in_progress</text>
  <line class="flow" x1="352" y1="92" x2="448" y2="92" marker-end="url(#ar)"/>
  <text class="m" x="400" y="84" text-anchor="middle">decide</text>

  <rect class="box" x="448" y="72" width="72" height="40" rx="6"/>
  <text class="st" x="484" y="97" text-anchor="middle">done</text>

  <path class="flow" d="M 84,112 L 84,188 L 232,188" marker-end="url(#ar)"/>
  <text class="m" x="158" y="180" text-anchor="middle">skip</text>
  <line class="flow" x1="292" y1="112" x2="292" y2="168" marker-end="url(#ar)"/>
  <text class="m" x="300" y="144">skip</text>
  <rect class="box" x="232" y="168" width="120" height="40" rx="6"/>
  <text class="st" x="292" y="193" text-anchor="middle">skipped</text>
  <text class="s" x="292" y="228" text-anchor="middle">the clip returns at the next</text>
  <text class="s" x="292" y="244" text-anchor="middle">queue build, as a new task</text>

  <line class="dash" x1="484" y1="112" x2="484" y2="168" marker-end="url(#ar)"/>
  <text class="mi" x="520" y="184" text-anchor="end">reopen</text>
  <text class="s" x="520" y="200" text-anchor="end">a new review task,</text>
  <text class="s" x="520" y="216" text-anchor="end">gated relabel</text>

  <line x1="40" y1="268" x2="520" y2="268" stroke="rgba(27,36,48,0.14)" stroke-width="0.8"/>

  <!-- Every decision -->
  <text class="e" x="40" y="296">EVERY DECISION</text>
  <rect class="box" x="40" y="312" width="480" height="64" rx="6"/>
  <text class="n" x="56" y="336">Accept, edit or flag</text>
  <text class="s" x="56" y="356">and say how hard it was looked at</text>
  <text class="mi" x="300" y="336">verified</text>
  <text class="s" x="300" y="356">played and read</text>
  <text class="mi" x="412" y="336">screened</text>
  <text class="s" x="412" y="356">not listened to</text>

  <line class="flow" x1="280" y1="376" x2="280" y2="400" marker-end="url(#ar)"/>

  <rect class="focal" x="40" y="400" width="480" height="104" rx="6"/>
  <text class="n" x="56" y="424">Refused with 409</text>
  <text class="s" x="56" y="448">screened, on a gold clip</text>
  <text class="s" x="56" y="468">screened, on a clip a hazard gate fired on</text>
  <text class="s" x="56" y="488">accept, when the current label is an edit (a reopened clip)</text>

  <line class="flow" x1="280" y1="504" x2="280" y2="536" marker-end="url(#ar)"/>
  <text class="s" x="292" y="524">otherwise</text>

  <rect class="store" x="40" y="536" width="480" height="120" rx="6"/>
  <text class="e" x="56" y="560">ONE TRANSACTION, THREE ROWS</text>
  <text class="mi" x="56" y="588">segment_labels</text>
  <text class="s" x="200" y="588">appended, never updated: disposition, tier</text>
  <text class="mi" x="56" y="612">annotation_events</text>
  <text class="s" x="200" y="612">the client-reported duration_ms</text>
  <text class="mi" x="56" y="636">audit_logs</text>
  <text class="s" x="200" y="636">old and new values</text>

  <text class="e" x="40" y="692">DISPOSITION</text>
  <text class="mi" x="40" y="712">accepted_unchanged · edited · unusable_audio · uncertain</text>

  <line x1="40" y1="736" x2="520" y2="736" stroke="rgba(27,36,48,0.14)" stroke-width="0.8"/>
  <text class="c" x="40" y="764">A skip writes the event and the audit row, never a label.</text>
</svg>
