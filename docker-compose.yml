name: labeling-harness

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${HARNESS_DATABASE__USER:-harness}
      POSTGRES_PASSWORD: ${HARNESS_DATABASE__PASSWORD:-harness}
      POSTGRES_DB: ${HARNESS_DATABASE__NAME:-harness}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${HARNESS_DATABASE__USER:-harness}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HARNESS_STORAGE__MINIO__ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${HARNESS_STORAGE__MINIO__SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      HARNESS_DATABASE__HOST: postgres
      HARNESS_DATABASE__USER: ${HARNESS_DATABASE__USER:-harness}
      HARNESS_DATABASE__PASSWORD: ${HARNESS_DATABASE__PASSWORD:-harness}
      HARNESS_DATABASE__NAME: ${HARNESS_DATABASE__NAME:-harness}
      HARNESS_STORAGE__BACKEND: ${HARNESS_STORAGE__BACKEND:-minio}
      HARNESS_STORAGE__MINIO__ENDPOINT: minio:9000
      HARNESS_STORAGE__MINIO__ACCESS_KEY: ${HARNESS_STORAGE__MINIO__ACCESS_KEY:-minioadmin}
      HARNESS_STORAGE__MINIO__SECRET_KEY: ${HARNESS_STORAGE__MINIO__SECRET_KEY:-minioadmin}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY:-}
      VERTEX_API_KEY: ${VERTEX_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      HARNESS_API__AUTH_TOKEN: ${HARNESS_API__AUTH_TOKEN:-}
      # The forced-alignment model (~317 MB) downloads itself on first use. It lands in
      # the mounted ./data volume rather than an image layer, so it survives `up` and is
      # fetched once. Set HARNESS_ALIGNER_NO_DOWNLOAD=1 to keep the old skip-spans mode.
      HARNESS_ALIGNER_MODEL_DIR: /app/data/models
      HARNESS_ALIGNER_NO_DOWNLOAD: ${HARNESS_ALIGNER_NO_DOWNLOAD:-}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
